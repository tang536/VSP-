plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

// 正式签名配置：从 app/keystore.properties 读取，证书丢失将无法发布升级包
def keystoreProps = new Properties()
def keystorePropsFile = file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

android {
    namespace 'com.vsp.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.vsp.app"
        minSdk 24
        targetSdk 36
        versionCode 11002
        versionName "1.1.2"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            if (keystoreProps.containsKey('storeFile')) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // Chaquopy 通过字符串加载 Python 模块，保持不混淆
            minifyEnabled false
            shrinkResources false
        }
    }
}

chaquopy {
    defaultConfig {
        version = "3.12"
        // 允许本机通过环境变量指定构建用的 Python；未设置时保持 Chaquopy 自动探测
        def vspPy = System.getenv("VSP_BUILD_PYTHON")
        if (vspPy) buildPython(vspPy)
        pip {
            install "yt-dlp"
        }
    }
}

dependencies {
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    // 网络视频预览改用 ExoPlayer：
    // 系统 MediaPlayer 对 HLS 相对分片、FLV/MKV、DASH 分离音轨支持很差，
    // 表现就是「下载正常、部分视频预览不了」。Media3 原生支持 HLS / DASH /
    // Progressive 容器，并可用 MergingMediaSource 把画面流和音轨合在一起播。
    implementation 'androidx.media3:media3-exoplayer:1.6.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.6.1'
    implementation 'androidx.media3:media3-exoplayer-dash:1.6.1'
    implementation 'androidx.media3:media3-ui:1.6.1'
}
